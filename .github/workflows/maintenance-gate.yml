name: Maintenance Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: maintenance-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: maintenance gate
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install

      - name: Evaluate 116 configuration and flake outputs
        run: nix flake check --no-build --impure --no-update-lock-file --option allow-import-from-derivation false

      - name: Evaluate all managed Home Manager activations
        shell: bash
        run: |
          for user in ysun zky wangrongfeng; do
            nix eval --raw --impure --no-update-lock-file --option allow-import-from-derivation false ".#nixosConfigurations.116.config.home-manager.users.$user.home.activationPackage.drvPath"
          done

      - name: Check 116 cache configuration and headless contracts
        run: nix build --impure --no-link --no-update-lock-file -L .#checks.x86_64-linux.host-116
